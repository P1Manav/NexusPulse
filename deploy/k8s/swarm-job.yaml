apiVersion: batch/v1
kind: Job
metadata:
  name: swarm-runner-job
  labels:
    app.kubernetes.io/name: agentic-message-board
    app.kubernetes.io/component: swarm-job
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentic-message-board
        app.kubernetes.io/component: swarm-job
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: swarm-runner
          image: agentic-message-board:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "src/main.py", "swarm"]
          env:
            - name: API_URL
              value: "http://message-board-service"
            - name: LLM_BACKEND
              value: "auto"
            - name: LLM_THREAD_POOL_SIZE
              value: "4"
            - name: SWARM_WAIT_SECONDS
              value: "60"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
