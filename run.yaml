# run.yaml — Automated evaluation entry point
# These commands are run EXACTLY, in order, from a fresh checkout.
# All commands are non-interactive and idempotent.

setup_commands:
  - "pip install -r requirements.txt"

run_commands:
  - "python src/main.py demo"

test_commands:
  - "python -m pytest src/tests -q"

notes: >
  LLM_BACKEND=auto by default: uses Claude CLI if both 'claude' binary is on
  PATH and CLAUDE_KEY env var is set; otherwise falls back to deterministic
  mock text (no API key required). Expected runtime: ~3 seconds on mock,
  1-2 minutes with Claude. For the interactive UI, run:
  python src/main.py serve
