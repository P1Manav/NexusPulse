services:
  - type: web
    name: agentic-message-board
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /readyz
    numInstances: 1
    disk:
      name: board-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: SQLITE_PATH
        value: /app/data/board.db
      - key: LLM_BACKEND
        value: auto