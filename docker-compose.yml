services:
  # ── API Service ──────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agentic-board-api
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - SQLITE_PATH=/app/data/board.db
      - LLM_BACKEND=auto
      - POST_QUEUE_MAX_SIZE=2000
      - POST_BATCH_SIZE=50
      - POST_BATCH_INTERVAL_MS=150
    volumes:
      - board_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request, os; p = os.getenv('PORT', '8000'); urllib.request.urlopen(f'http://127.0.0.1:{p}/readyz').read()\""]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    restart: unless-stopped

  # ── Swarm Runner Service ─────────────────────────────────
  swarm:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agentic-board-swarm
    command: ["swarm"]
    environment:
      - API_URL=http://api:8000
      - LLM_BACKEND=auto
      - LLM_THREAD_POOL_SIZE=4
      - SWARM_WAIT_SECONDS=60
    depends_on:
      api:
        condition: service_healthy
    restart: "no"

volumes:
  board_data:
