name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test & Demo (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Suite (44+ tests)
        run: |
          python -m pytest src/tests -q

      - name: Run Full Live Demo (Exit Code 0 Verification)
        run: |
          python src/main.py demo

  container-and-k8s:
    name: Container Build & K8s Manifest Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Config
        run: |
          docker compose config

      - name: Build Docker Container
        run: |
          docker build -t agentic-message-board:test .

      - name: Run Demo Inside Container
        run: |
          docker run --rm agentic-message-board:test demo

      - name: Verify Container Health Probe
        run: |
          docker run -d --name test-api -p 8000:8000 agentic-message-board:test
          sleep 4
          docker exec test-api python -c "import urllib.request; print(urllib.request.urlopen('http://127.0.0.1:8000/healthz').read().decode())"
          docker stop test-api

      - name: Validate Kubernetes Manifests with Kustomize
        run: |
          kubectl kustomize deploy/k8s
